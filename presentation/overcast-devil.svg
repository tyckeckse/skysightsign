<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 792 262" width="792" height="262" role="img" aria-label="The main model says 70 percent; the devil, informed by five other weather models, decides whether to change it to 100 percent">
  <style>
    .bg { fill: #fffdf8; stroke: #d9d0c3; }
    .box { fill: #e3ecf2; stroke: #1c4f73; stroke-width: 1.2; }
    .hl { stroke-width: 2; }
    .yes { fill: #efe8db; }
    .label { fill: #1d2a2f; font: 600 13px "Segoe UI", -apple-system, system-ui, sans-serif; }
    .sub { fill: #617076; font: 11px "Segoe UI", -apple-system, system-ui, sans-serif; }
    .arrow { stroke: #617076; stroke-width: 1.4; fill: none; marker-end: url(#arrowhead); }
    .arrowhead { fill: #617076; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1d2326; stroke: #33393c; }
      .box { fill: #23313a; stroke: #8ec1e3; }
      .yes { fill: #262c2f; }
      .label { fill: #e6e2da; }
      .sub, .arrowhead { fill: #9aa6aa; }
      .arrow { stroke: #9aa6aa; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="-15.5" y="-15.5" width="791" height="261" rx="10"/>
  <rect class="box" x="10" y="20" width="170" height="60" rx="8"/>
  <text class="label" x="95" y="45" text-anchor="middle">Main model</text>
  <text class="sub" x="95" y="64" text-anchor="middle">"70 % cloud"</text>
  <rect class="box" x="10" y="130" width="170" height="80" rx="8"/>
  <text class="label" x="95" y="155" text-anchor="middle">5 other models</text>
  <text class="sub" x="95" y="174" text-anchor="middle">DMI, GFS, UKMO,</text>
  <text class="sub" x="95" y="190" text-anchor="middle">Météo-France, ECMWF</text>
  <rect class="box hl" x="250" y="70" width="200" height="90" rx="10"/>
  <text class="label" x="350" y="102" text-anchor="middle">😈 The devil</text>
  <text class="sub" x="350" y="122" text-anchor="middle">"Will it be completely</text>
  <text class="sub" x="350" y="138" text-anchor="middle">grey (95 %+)?"</text>
  <rect class="box yes" x="540" y="20" width="210" height="70" rx="8"/>
  <text class="label" x="645" y="46" text-anchor="middle">Likely: show 100 %</text>
  <text class="sub" x="645" y="66" text-anchor="middle">overcast, no sun</text>
  <rect class="box" x="540" y="140" width="210" height="70" rx="8"/>
  <text class="label" x="645" y="166" text-anchor="middle">Unlikely: keep 70 %</text>
  <text class="sub" x="645" y="186" text-anchor="middle">main model decides</text>
  <path class="arrow" d="M180,58 L248,98"/>
  <path class="arrow" d="M180,168 L248,135"/>
  <path class="arrow" d="M450,100 L538,58"/>
  <path class="arrow" d="M450,130 L538,172"/>
</svg>
